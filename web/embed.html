<!doctype html>
<html lang="zh-Hant" data-theme="system">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>外部網站嵌入 Stage.js</title></head>
<body><div id="app"><h1>外部網站 · Stage.js ESM 整合</h1><p>此頁從指定的 Stage.js 主機載入 /lib/stage-client.js，並使用該主機指定路徑的 WebSocket 控制面（預設 /ws）。</p>
<form class="panel" id="join"><label class="field">Stage.js 主機網址<input id="host" type="url" required placeholder="https://stage.example.com"></label><label class="field">WebSocket 路徑<input id="ws-path" value="/ws" placeholder="/ws" autocomplete="off"></label><label class="field">房間 ID<input id="room" required maxlength="128"></label><label class="field">房間代碼<input id="code"></label><label class="field">你的名稱<input id="name" required></label><button class="primary">加入收聽</button></form>
<button id="cancel-join" type="button" hidden disabled>取消連線</button>
<div id="room-name-panel" class="panel" hidden><p id="room-name-current"></p><label class="field" for="room-name-draft">房間名稱<input id="room-name-draft" disabled></label><button id="room-name-update" type="button" aria-busy="false" disabled>更新房間名稱</button></div>
<details id="hand-queue" class="panel" hidden><summary id="hand-queue-summary">舉手申請（0）</summary><p id="hand-queue-notice" class="muted"></p><ul id="hand-queue-list" class="people" aria-label="舉手申請"></ul></details>
<div id="output-panel" class="panel audio-settings" hidden><label class="field" for="output-device">輸出裝置選擇（草稿）<select id="output-device" aria-describedby="output-draft-notice output-support" disabled><option value="">系統預設</option></select></label><div class="actions"><button id="output-refresh" type="button" aria-busy="false" disabled>重新整理輸出裝置清單</button><button id="output-apply" type="button" aria-busy="false" disabled>送出輸出裝置選擇</button></div><p id="output-draft-notice" class="muted">草稿不代表目前實際輸出或可聽見聲音；請另按送出套用。草稿與清單會保留至此頁關閉，離房不會重設輸出裝置。重新整理清單不會開啟麥克風。</p><p id="output-support" class="muted" hidden></p></div>
<div id="microphone-panel" class="panel audio-settings" hidden><label class="field" for="microphone-device">麥克風選擇（草稿）<select id="microphone-device" aria-describedby="microphone-draft-notice" disabled><option value="">預設（依 SDK 設定）</option></select></label><div class="actions"><button id="microphone-refresh" type="button" aria-busy="false" disabled>重新整理麥克風清單</button><button id="microphone-apply" type="button" aria-busy="false" disabled>送出麥克風選擇</button></div><p id="microphone-draft-notice" class="muted">草稿不代表目前實際擷取裝置；若顯示「重試麥克風」，送出選擇後仍須另按重試。重新整理清單不會開啟麥克風；預設選項沿用 SDK 設定。</p></div>
<p id="status" aria-live="polite">尚未加入</p><p id="hand-rejected" class="banner" role="status" hidden></p><div id="error-notice" class="banner error" hidden><p id="last-error" role="alert"></p><button id="error-dismiss" type="button">關閉錯誤提示</button></div><button id="unlock" type="button">點擊啟用音訊</button><button id="audio-retry" type="button" aria-busy="false" aria-describedby="audio-retry-status" hidden disabled>重試音訊連線</button><p id="audio-retry-status" role="status" hidden></p><button id="rename" type="button" aria-busy="false" hidden disabled>更新名稱</button><button id="hand" type="button" disabled>舉手發言</button><button id="mic" type="button" aria-label="麥克風靜音" aria-pressed="false" aria-busy="false" hidden disabled>靜音麥克風</button><button id="mic-retry" type="button" aria-busy="false" hidden disabled>重試麥克風</button><button id="stage" type="button" aria-busy="false" hidden disabled>離開舞台</button><button id="leave" type="button" disabled>離開房間</button><audio id="audio" autoplay controls></audio>
</div><script type="module" src="/src/embed.ts"></script></body>
</html>
