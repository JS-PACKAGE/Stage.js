# Stage.js 設定範本。複製為 config.yaml 後修改（config.yaml 不入庫）。
# 所有欄位皆必填；程式不寫死任何參數。標「可調整」者為新創數值。

server:
  host: 127.0.0.1
  port: 9728
  wsPath: /ws
  # 明文 ws 僅限本機開發：true 時 host 必須是 loopback（127.0.0.1／::1／localhost），否則拒絕啟動。
  # 對外部署請設 false 並提供 TLS 憑證（或由本機反向代理終止 TLS）。
  allowInsecure: true
  tls:
    certFile: ""
    keyFile: ""
  # 靜態檔掛載（空陣列停用）。/lib/ 提供 client 函式庫給外部網站 ESM 匯入（附 CORS *）。
  static:
    - mount: /
      dir: web/dist
      cors: false
    - mount: /lib/
      dir: packages/client/dist
      cors: true
  # GET /metrics（Prometheus 文字格式）。token 非空時需 `Authorization: Bearer <token>`；
  # 對外 host 啟用時 token 必填（否則拒絕啟動）。token 只放 config.yaml。
  metrics:
    enabled: true
    token: ""

limits:
  maxRooms: 100                # 可調整
  maxConnections: 2000         # 可調整
  maxSpeakersPerRoom: 8        # 裁示定值
  maxAudiencePerRoom: 300      # 裁示定值
  maxFrameBytes: 65536         # 可調整（64KB）
  controlPerSecond: 20         # 可調整
  handRaiseIntervalMs: 10000   # 可調整
  icePerSecond: 30             # 可調整
  nameMaxLength: 32
  codeMaxLength: 16
  sdpMaxLength: 16384

rooms:
  codeLength: 8                # 房間代碼長度（可調整）
  controllerGraceMs: 60000     # 主控斷線逾此時間才自動移交（可調整）
  heartbeatIntervalMs: 30000   # ws ping 間隔
  presenceBroadcastMs: 250     # 觀眾進出時合併 room:state 廣播的時間窗（0＝即時；大量同時進場時避免 N² 廣播，可調整）

audio:
  sampleRate: 48000            # 擷取／混音／Opus 編解碼取樣率（Opus 原生 48k，無重取樣）
  frameMs: 20
  codecWorkers: 2              # Opus 編解碼 worker thread 數；房間平均分配，建議 ≤ CPU 核心數 − 1
  opus:
    vbr: true
    minBitrate: 32000
    maxBitrate: 128000
    bitrate: 64000             # VBR 目標，須落在 min..max
    complexity: 9
    fec: true                  # in-band FEC：觀眾端可由下一包還原遺失包
    packetLossPercent: 10      # 預期下行掉包率（%），FEC 依此配置冗餘位元（可調整）
    dtx: true                  # 靜音不送包（≤2 bytes 的 DTX 幀不傳），省觀眾頻寬
  mixer:
    maxBufferedFrames: 10      # 每路 PCM 緩衝上限（10×20ms=200ms），超過丟最舊
    limiterThreshold: 0.9      # soft-clip 起點（0..1）
    latencyTargetMs: 300       # 可調整（Gate 3 目標）
    speakingThreshold: 0.02    # 單幀 RMS 超過即視為「正在說話」（約 −34 dBFS，可調整）
    speakingHoldMs: 400        # 說話狀態在最後一個有聲幀後維持多久，避免指示燈閃爍（可調整）
  jitter:
    playoutFrames: 3           # 每路上行先緩衝 3 幀（60ms）才開始播；underrun 後重新緩衝（可調整）
    reorderPackets: 2          # 亂序容忍：缺包後再收到幾包即判定遺失並補幀（可調整）
  noiseFilter:                 # 伺服器端上行降噪（瀏覽器端另有 noiseSuppression）
    enabled: true
    highPassHz: 80             # 高通濾波：濾掉低頻嗡嗡聲、碰麥、桌面震動（可調整）
    gateThreshold: 0.008       # 噪音門：單幀 RMS 低於此值視為背景噪音（約 −42 dBFS，須低於 speakingThreshold）
    gateHoldMs: 200            # 最後一個有聲幀後維持開啟多久，避免切掉字尾（可調整）
    gateFloor: 0.1             # 關門時的增益（0.1≈−20 dB；0＝完全靜音，較生硬）

rtc:
  # 下發給瀏覽器的靜態 ICE servers（STUN）。TURN 請用下方 turn 區塊發短期憑證，勿把長期帳密放這裡。
  iceServers:
    - urls: ["stun:stun.l.google.com:19302"]
  # 伺服器端（werift）ICE 設定
  serverIceServers:
    - urls: ["stun:stun.l.google.com:19302"]
  # UDP port 範圍（[min, max]）；空陣列＝系統自選
  portRange: []
  # 承載 PeerConnection（ICE／DTLS／SRTP／RTP 打包）的 worker thread 數；peer 分散到最少負載的 worker。
  # 0＝全在主執行緒：werift 每送一包約 70µs CPU，單一執行緒約在 250–300 位聽眾時吃滿 20ms tick，
  # 大批進場時的 DTLS 握手也會卡住混音時鐘；1 條 worker 一樣會被 300 位聽眾吃滿而延誤上行轉送。
  # 預設 2 對應每房 300 聽眾的裁示上限（與 audio.codecWorkers 合計勿超過核心數；核心少時調低），
  # 用 load-test 驗證。
  mediaWorkers: 2
  # 短期 TURN 憑證（coturn：use-auth-secret + static-auth-secret）。每次進房以 HMAC 簽發，
  # 帳密逾 ttlSeconds 失效；secret 只放 config.yaml，不入庫、不入日誌。urls 空陣列＝停用。
  turn:
    urls: []                   # 例：["turn:turn.example.com:3478?transport=udp", "turns:turn.example.com:5349"]
    secret: ""                 # 與 coturn static-auth-secret 相同（≥16 字元）
    ttlSeconds: 86400          # 建議長於最長場次：瀏覽器在 allocation refresh 時沿用同一組帳密（可調整）

log:
  level: info                  # debug | info | warn | error
